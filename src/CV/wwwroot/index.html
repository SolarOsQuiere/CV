    <style>
        /* Splash de precarga: se muestra mientras Blazor WebAssembly descarga y arranca */
        #splash {
            position: fixed; inset: 0; z-index: 3000;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem;
            background: #f4f5f9;
            font-family: "Muli", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            transition: opacity .5s ease, visibility .5s ease;
        }
        #splash.is-hidden { opacity: 0; visibility: hidden; }
        #splash .splash-photo {
            width: 132px; height: 132px; border-radius: 50%;
            object-fit: cover; object-position: center 18%;
            border: 5px solid #fff;
            box-shadow: 0 0 0 4px rgba(16, 134, 197, .4), 0 14px 34px rgba(16, 134, 197, .35);
            animation: splash-pulse 1.6s ease-in-out infinite;
        }
        #splash .splash-name { margin: 0; color: #1f2933; font-size: 1.35rem; font-weight: 800; }
        #splash .splash-role { margin: -.7rem 0 0; color: #5f6b76; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; }
        #splash .splash-bar { width: 180px; height: 4px; overflow: hidden; border-radius: 2px; background: #dde3e9; }
        #splash .splash-bar span {
            display: block; height: 100%; width: var(--blazor-load-percentage, 8%);
            border-radius: 2px; background: #1086c5; transition: width .25s ease;
        }
        #splash .splash-error { max-width: 420px; padding: 0 1.25rem; text-align: center; color: #5f6b76; font-size: .9rem; }
        #splash .splash-error strong { display: block; margin-bottom: .35rem; color: #1f2933; font-size: 1rem; }
        #splash .splash-error button {
            margin-top: .9rem; padding: .5rem 1.2rem; border: 0; border-radius: 999px;
            background: #1f2933; color: #fff; font-weight: 700; cursor: pointer;
        }
        #splash.has-error .splash-bar { display: none; }
        @keyframes splash-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        @media (prefers-reduced-motion: reduce) { #splash .splash-photo { animation: none; } }
    </style>
</head>

<body>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.min.js" integrity="sha384-VHvPCCyXqtD5DqJeNxl2dtTyhF78xXNXdkwX1CZeRusQfRKp+tA7hAShOK/B/fQ2" crossorigin="anonymous"></script>
    <script src="js/scripts.js"></script>

    <script>
        // Splash de precarga: se oculta cuando Blazor ha pintado cualquier pagina (la web o la 404),
        // con un minimo de 700 ms para evitar parpadeos. Si el arranque falla, informa del error.
        (function () {
            var splash = document.getElementById('splash');
            var app = document.getElementById('app');
            var start = Date.now();
            var done = false;
            var es = (navigator.language || 'en').slice(0, 2) === 'es';
            var texts = es
                ? { title: 'No se pudo cargar la aplicación', body: 'Recarga la página con Ctrl+F5. Si sigue fallando, borra los datos del sitio o inténtalo de nuevo en unos minutos.', btn: 'Recargar' }
                : { title: 'The application could not be loaded', body: 'Reload the page with Ctrl+F5. If it keeps failing, clear the site data or try again in a few minutes.', btn: 'Reload' };

            function hide() {
                if (done) return;
                done = true;
                var wait = Math.max(0, 700 - (Date.now() - start));
                setTimeout(function () {
                    splash.classList.add('is-hidden');
                    setTimeout(function () { splash.remove(); }, 600);
                }, wait);
            }

            function showError() {
                if (done) return;
                var box = splash.querySelector('.splash-error');
                box.querySelector('strong').textContent = texts.title;
                box.querySelector('span').textContent = texts.body;
                var btn = box.querySelector('button');
                btn.textContent = texts.btn;
                btn.onclick = function () { location.reload(); };
                box.hidden = false;
                splash.classList.add('has-error');
            }

            var observer = new MutationObserver(function () {
                if (app.firstElementChild) { observer.disconnect(); hide(); }
            });
            observer.observe(app, { childList: true, subtree: true });

            // Fallos de arranque de Blazor (p. ej. integridad de los .wasm) llegan como promesas rechazadas.
            window.addEventListener('unhandledrejection', showError);
            setTimeout(showError, 25000);
        })();
    </script>

    <script>
        // Normaliza las mayusculas de la ruta base: el servidor de desarrollo acepta /cv/ pero Blazor exige
        // la misma capitalizacion que <base href> (/CV/) y, si no coincide, no llega a arrancar.
        (function () {
            var base = new URL(document.baseURI).pathname;
            var path = location.pathname;
            if (path !== base && path.indexOf(base) !== 0 && path.toLowerCase().indexOf(base.toLowerCase()) === 0) {
                location.replace(base + path.slice(base.length) + location.search + location.hash);
            }
        })();
    </script>

    <script src="_framework/blazor.webassembly.js"></script>


    <script>
        window.blazorCulture = {

name: PublishApp

env:
  PUBLISH_DIR: src/CV/bin/Release/net10.0/publish/wwwroot
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm tools
        run: dotnet workload install wasm-tools

      - name: Restore dependencies
        run: dotnet restore src/CV/CV.csproj

      - name: Publish app
        run: dotnet publish src/CV/CV.csproj -c Release

      - name: Verify publish folder
        run: ls -R src/CV/bin/Release/net10.0/publish

      - name: Rewrite base href
        uses: SteveSandersonMS/ghaction-rewrite-base-href@v1
        with:
          html_path: ${{ env.PUBLISH_DIR }}/index.html
          base_href: /CV/

      - name: Create 404.html from index.html
        run: cp ${{ env.PUBLISH_DIR }}/index.html ${{ env.PUBLISH_DIR }}/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ env.GITHUB_TOKEN }}
          publish_dir: ${{ env.PUBLISH_DIR }}
